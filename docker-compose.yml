services:
  # Laravel API
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    user: "${HOST_UID}:${HOST_GID}"
    container_name: ai-chat-api
    volumes:
      - ./api:/var/www/api
      - ./docker/api:/var/www/api/docker
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JINA_API_KEY: ${JINA_API_KEY}
      VOYAGEAI_API_KEY: ${VOYAGEAI_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      LOG_CHANNEL: stack
    depends_on:
      - mysql
    networks:
      - ai-chat-network

  # Nginx para API
  nginx-api:
    image: nginx:stable-alpine
    container_name: ai-chat-nginx-api
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/api:ro
      - ./docker/api/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx/api:/var/log/nginx
    depends_on:
      - api
    networks:
      - ai-chat-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ai-chat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./data/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - ai-chat-network

  # PhpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ai-chat-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      PMA_BLOWFISH_SECRET: ${PMA_BLOWFISH_SECRET}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 2048M
    volumes:
      - ./docker/mysql/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    depends_on:
      - mysql
    networks:
      - ai-chat-network

  # Frontend Vue.js (Vite)
  web:
    image: node:22-alpine
    container_name: ai-chat-web
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api
    networks:
      - ai-chat-network

networks:
  ai-chat-network:
    driver: bridge
